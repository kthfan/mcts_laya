[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcts-laya"
version = "0.1.0"
description = "AlphaZero-style search and self-improvement with Laya (Convai Innovations) as the policy/value network"
requires-python = ">=3.10"
dependencies = [
    "laya==0.3.24",
    "torch>=2.4",
    "transformers>=5.0",
    "tokenizers>=0.20",
    "safetensors",
    "huggingface_hub",
    "numpy",
    "sympy>=1.12",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
textworld = ["textworld>=1.6"]

[project.scripts]
mcts-laya = "mcts_laya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:jericho.*", "ignore:.*UnsupportedGameWarning.*"]
